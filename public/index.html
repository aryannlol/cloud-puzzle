<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>(function(){try{var t=localStorage.getItem('cloudPuzzleTheme')||'system';var d=t==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.dataset.theme=d}catch(e){document.documentElement.dataset.theme='light'}}())</script>
  <title>Cloud Puzzle</title>
  <link rel="stylesheet" href="style.css?v=11">
  <link rel="stylesheet" href="landing.css?v=11">
  <link rel="stylesheet" href="game.css?v=11">
  <link rel="stylesheet" href="game-refinement.css?v=11">
</head>
<body>


  <main>
    <section id="home" class="home-screen">
      <button id="theme" class="home-theme-btn" type="button" aria-label="Switch theme">Theme: System</button>
      <div class="landing-content">
        <h1>CLOUD PUZZLE</h1>
        <p>Bring a picture. Solve it together.</p>
        <div id="resume-container" style="display:none;margin-bottom:16px;">
          <button id="resume-btn" class="landing-button" style="background:var(--blue);color:var(--white);width:100%;max-width:360px;padding:14px;border-radius:10px;font-weight:900;" type="button">RESUME ROOM (<span id="resume-code"></span>)</button>
        </div>
        <div class="landing-actions">
          <button id="create-entry" class="landing-button create-button" type="button">CREATE GAME</button>
          <button id="join-entry" class="landing-button join-button" type="button">JOIN GAME</button>
        </div>
        <p id="home-status" class="form-message" style="margin-top:14px;"></p>
      </div>
      <form id="create-form" hidden><input id="create-name" required><input id="image" type="file" accept="image/*" required><select id="count"></select><select id="size"><option value="5">5 × 5</option><option value="6">6 × 6</option><option value="9" selected>9 × 9</option></select><button id="create" type="submit">Create</button><p id="create-message"></p></form>
      <form id="join-form" hidden><input id="join-name" required><input id="code" required><button id="join" type="submit">Join</button><p id="join-message"></p></form>
    </section>

    <dialog id="setup-dialog"><form id="setup-form"><h2 id="setup-title"></h2><div id="setup-fields"></div><p id="setup-message" class="form-message" role="alert"></p><div class="dialog-actions"><button id="setup-cancel" type="button">Cancel</button><button id="setup-submit" class="dialog-submit" type="submit">Continue</button></div></form></dialog>

    <section id="game" class="game-screen" hidden>
      <header class="game-topbar">
        <div class="topbar-left">
          <div class="room-badge">
            <span id="connection-dot" class="connection-dot" title="Connected"></span>
            <span class="room-label">Room</span>
            <strong id="room" class="room-code"></strong>
            <button id="copy-room" class="copy-mini-btn" type="button" title="Copy room code">Copy</button>
          </div>
          <div id="connection" style="display:none;"><span id="connection-status">Connecting</span></div>
        </div>

        <div class="topbar-right">
          <div id="game-message" class="game-topbar-notice" role="status"></div>
          <button id="hint" class="compact-tool-btn" type="button" aria-label="Show a helpful move" title="Show the best next swap"><span>Hint</span></button>
          <button id="preview" class="compact-tool-btn" type="button" aria-label="Preview correct region" title="Preview original image">
            <svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
            <span>Preview</span>
          </button>
          <details id="game-menu" class="compact-menu">
            <summary class="menu-btn" title="Options & Settings" aria-label="Settings">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </summary>
            <div class="menu-dropdown">
              <button id="theme-in-game" class="menu-action" type="button" aria-label="Toggle color theme">Theme: System</button>
              <label class="menu-action check-label"><input id="debug" type="checkbox"> Show tile coordinates</label>
              <button id="solve-btn" class="menu-action" type="button" title="Step-by-step region solver demonstration">Demo Auto Solve</button>
              <hr class="menu-sep">
              <button id="leave" class="menu-action danger-action" type="button">Back home</button>
            </div>
          </details>
        </div>
      </header>

      <div id="active-content" class="game-layout">
        <div class="play-arena">
          <div class="board-header">
            <div class="board-header-left">
              <span id="player-dot" class="player-dot"></span>
              <h2 id="region-label" class="board-title"></h2>
              <span id="player-name" style="display:none;"></span>
              <span id="player-region" style="display:none;"></span>
            </div>
            <div class="board-header-right">
              <span id="region-meta" class="board-meta"></span>
              <span id="game-status" class="status-pill" hidden></span>
            </div>
          </div>
          <div class="thin-progress"><div id="player-progress"></div></div>
          <div id="board" aria-label="Your puzzle region"></div>
        </div>

        <aside class="utility-sidebar">
          <div class="thumb-card" title="Click to view full image">
            <div class="thumb-header">
              <span class="utility-heading">Original</span>
              <span class="thumb-hint">Expand</span>
            </div>
            <button id="thumb-btn" type="button" class="thumb-btn" aria-label="Expand original image">
              <img id="reference" alt="Original uploaded puzzle image">
            </button>
          </div>
          <div class="players-panel">
            <div class="players-panel-header">
              <span class="utility-heading">Players</span>
              <span id="connected-count" class="players-count-badge"></span>
            </div>
            <div id="players"></div>
          </div>
        </aside>
      </div>

      <dialog id="image-modal" class="image-modal">
        <div class="modal-box">
          <div class="modal-top">
            <span>Original Image</span>
            <button id="close-modal-btn" class="modal-close-btn" type="button" aria-label="Close">✕</button>
          </div>
          <img id="modal-img" alt="Enlarged original puzzle image">
        </div>
      </dialog>

      <section id="completion" class="card completion" hidden>
        <div class="confetti-mark">DONE</div>
        <p class="eyebrow">Everyone got there</p>
        <h1>Puzzle completed!</h1>
        <p class="hero-copy">You pieced it together, together.</p>
        <img id="completed-image" alt="Completed puzzle image">
        <div id="final-players" class="final-players"></div>
        <button id="play-again" class="primary" type="button">Back home</button>
      </section>
    </section>
  </main>
  <script src="app.js?v=10"></script>
</body>
</html>
